name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Kartenlogik offline prüfen
        run: node --test tests/frontend/*.test.mjs

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Home-Assistant-Struktur prüfen
        uses: home-assistant/actions/hassfest@master

  python-313-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Python 3.13 einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Python-3.13-Syntax prüfen
        run: python -m compileall -q custom_components/pv_forecast

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Abhängigkeiten installieren
        run: python -m pip install --requirement requirements_test.txt

      - name: Ruff ausführen
        run: ruff check custom_components tests

      - name: Black prüfen
        run: black --check custom_components tests

      - name: Deutsche Sprachressourcen abgleichen
        run: python scripts/sync_translations.py --check

      - name: Tests ausführen
        run: pytest -v
