get_forecast:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: pv_forecast
    include_explanation:
      selector:
        boolean:
    include_view:
      default: false
      selector:
        boolean:
    day:
      default: today
      selector:
        select:
          options:
            - label: "Heute"
              value: today
            - label: "Morgen"
              value: tomorrow
    roof_id:
      selector:
        text:
    window:
      example: '{"start": "2026-09-10T08:15:00Z", "end": "2026-09-10T11:15:00Z", "step_minutes": 30}'
      selector:
        object:
    planning:
      example: '{"duration_minutes": 120, "earliest_start": "2026-09-09T08:00:00+00:00", "latest_end": "2026-09-09T18:00:00+00:00"}'
      selector:
        object:
get_measurements:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: pv_forecast
    start:
      required: true
      example: "2026-09-09T00:00:00+00:00"
      selector:
        text:
    end:
      required: true
      example: "2026-09-10T00:00:00+00:00"
      selector:
        text:
    interval_windows:
      selector:
        object:
    include_outlook:
      default: false
      selector:
        boolean:
get_history:
  fields:
    day_view:
      example: '{"date": "2026-09-09", "horizon": "hourly_1h"}'
      selector:
        object:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: pv_forecast
    days:
      default: 30
      selector:
        select:
          options:
            - label: "7 Tage"
              value: "7"
            - label: "30 Tage"
              value: "30"
            - label: "90 Tage"
              value: "90"
    include_records:
      default: false
      selector:
        boolean:
    current_targets:
      default: false
      selector:
        boolean:
export_history:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: pv_forecast
    days:
      default: 30
      selector:
        select:
          options:
            - label: "7 Tage"
              value: "7"
            - label: "30 Tage"
              value: "30"
            - label: "90 Tage"
              value: "90"
    format:
      required: true
      selector:
        select:
          options:
            - json
            - csv
